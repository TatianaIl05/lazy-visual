name: Generate golden baselines
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest pytest-mpl .
      - name: Generate baselines
        run: python -m pytest tests/test_golden.py --mpl --mpl-generate-path=tests/baseline -q
      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tests/baseline/
          git diff --cached --quiet && echo 'no changes' || \
            git commit -m 'ci: regenerate golden baselines (Linux + latest mpl)'
          git push
