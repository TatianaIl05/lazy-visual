name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        deps: ["min", "last"]
        exclude:
          - python: "3.13"
            deps: "min"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install min deps
        if: matrix.deps == 'min'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.*" "scipy==1.10.*" "pandas==1.5.*" "matplotlib==3.7.*" pytest
      - name: Install latest deps
        if: matrix.deps == 'last'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest pytest-mpl
      - name: Install package
        shell: bash
        run: python -m pip install -e .
      - name: Run tests
        shell: bash
        run: |
          if [ "${{ matrix.deps }}" = "last" ]; then
            python -m pytest -q --mpl --mpl-baseline-path=tests/baseline
          else
            python -m pytest -q
          fi
