[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazy-visual"
version = "0.1.2"
description = "One-line statistical plots with built-in stats."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "lazy-visual contributors" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5", "matplotlib>=3.7"]

[project.optional-dependencies]
parquet = ["pyarrow>=10"]
excel = ["openpyxl>=3.1"]
dev = ["pytest", "pytest-mpl", "pytest-benchmark", "pytest-socket", "mypy", "ruff", "scikit-learn"]

[tool.hatch.build.targets.wheel]
packages = ["lazy_visual"]
artifacts = [
  "lazy_visual/themes/*.json",
  "lazy_visual/py.typed",
]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

